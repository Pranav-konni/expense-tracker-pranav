<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- font -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- chart -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.js"></script>

    <!-- style -->
    <link rel="stylesheet" href="/src/assets/css/style.css" />

    <title>Expense Tracker</title>
  </head>

  <body>
    <div class="app-container">
      <!-- header -->
      <div class="app-header">
        <div class="brand">
          <i class="fas fa-wallet"></i>
          Expense Tracker
        </div>

        <div class="header-actions">
          <button class="theme-btn" id="themeToggle">
            <i class="fas fa-moon" id="themeIcon"></i>
          </button>

          <button id="clearAllBtn">
            <i class="fas fa-trash-alt"></i>
            <span>Clear All</span>
          </button>
        </div>
      </div>

      <!-- stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Balance</div>
          <div class="stat-value-balance" id="totalBalance">₹0.00</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Total Income</div>
          <div class="stat-value-income" id="totalIncome">₹0.00</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Total Expenses</div>
          <div class="stat-value-expenses" id="totalExpenses">₹0.00</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Transactions</div>
          <div class="stat-value-expenses" id="transactionCount">0</div>
        </div>
      </div>

      <!-- Main-grid -->
      <div class="main-grid">
        <!-- left -->
        <div class="left-col">
          <div class="add-form">
            <h3>
              <i class="fas fa-plus-circle" style="color: var(--accent)">
                Add Transaction
              </i>
            </h3>

            <div class="form-row">
              <div class="form-group">
                <label>Description</label>
                <input
                  type="text"
                  id="descInput"
                  placeholder="e.g. bill or salary"
                />
              </div>

              <div class="form-group">
                <label for="amountInput">Amount</label>
                <input
                  type="number"
                  id="amountInput"
                  placeholder="0.00"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label>Category</label>

                <select id="categorySelect">
                  <option value="default" disabled selected>
                    Select Category
                  </option>

                  <option value="Food">🍴 Food</option>
                  <option value="Transportation">🚌 Transportation</option>
                  <option value="Households">🏠 Households</option>
                  <option value="Entertainment">🍿 Entertainment</option>
                  <option value="Bills">⚡ Bills</option>
                  <option value="Salary">💵 Salary</option>
                  <option value="Healthcare">🏥 Healthcare</option>
                  <option value="Shopping">🛒 Shopping</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <button class="btn-add" id="addBtn">
                <i class="fas fa-plus"></i>
                Add
              </button>
            </div>

            <div
              style="
                display: flex;
                gap: 12px;
                margin-top: 10px;
                flex-wrap: wrap;
              "
            >
              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  font-size: 14px;
                  cursor: pointer;
                "
              >
                <input type="radio" name="type" value="expense" checked />
                Expense
              </label>

              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  font-size: 14px;
                  cursor: pointer;
                "
              >
                <input type="radio" name="type" value="income" />
                Income
              </label>
            </div>
          </div>

          <!-- chart -->
          <div class="chart-card">
            <h3>
              <i class="fas fa-chart-pie" style="color: var(--accent)"></i>
              Spending by category
            </h3>

            <div class="chart-container">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Right: Expenses List -->
        <div class="right-col">
          <div class="expenses-header">
            <h3>
              <i class="fas fa-list" style="color: var(--accent)"></i>
              Transaction
            </h3>

            <div class="filter-group">
              <select id="filterCategory">
                <option value="all">All Categories</option>
                <option value="Food">🍴 Food</option>
                <option value="Transportation">🚌 Transportation</option>
                <option value="Households">🏠 Households</option>
                <option value="Entertainment">🍿 Entertainment</option>
                <option value="Bills">⚡ Bills</option>
                <option value="Salary">💵 Salary</option>
                <option value="Healthcare">🏥 Healthcare</option>
                <option value="Shopping">🛒 Shopping</option>
                <option value="Other">Other</option>
              </select>

              <select id="filterType">
                <option value="all">All</option>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
          </div>

          <div class="expenses-list" id="expensesList">
            <!-- Expenses will be dynamically added here -->
            <div class="no-expenses">
              No Transactions yet. Add your first expense!
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>y
